; PlatformIO Project Configuration File
; SmartLock Pro - ESP32 Firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_LOOP_STACK_SIZE=8192
    -D ESP32
    -D ESP32_WROOM_32

; Libraries
lib_deps = 
    adafruit/Adafruit Fingerprint Sensor Library@^2.0.0
    miguelbalboa/MFRC522@^1.4.11
    arduino-libraries/Keypad@^3.1.1
    knolleary/PubSubClient@^2.8.0
    bblanchon/ArduinoJson@^6.21.2
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/DHT sensor library@^1.4.4
    espressif/ESP32Servo@^0.13.0
    espressif/ESP32 Time@^1.0.1
    espressif/ESP32 OTA@^0.5.0

; Partition scheme
board_build.partitions = default_8MB.csv

; Upload options
upload_protocol = esptool

; Debugging
debug_tool = esp-prog
debug_init_break = tbreak setup

; Monitor filters
monitor_filters = 
    esp32_exception_decoder
    direct
    time

; Build options
build_type = release
board_build.flash_mode = dout
board_build.f_cpu = 240000000L

; Optimizations
build_unflags = -Os
build_flags = 
    -O2
    -ffast-math
    -fno-exceptions
    -fno-rtti
    -DNDEBUG
    -D ESP32

; Memory settings
board_build.arduino.memory_type = qio_opi
board_build.extra_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
