version: '3.8'

services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: smartlock-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"      # MQTT
      - "8883:8883"      # MQTT TLS
      - "9001:9001"      # MQTT WebSocket
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/mosquitto/passwd:/mosquitto/config/passwd
      - ./config/mosquitto/acl:/mosquitto/config/acl
      - ./data/mosquitto:/mosquitto/data
      - ./logs/mosquitto:/mosquitto/log
    networks:
      - smartlock-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartlock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartlock
      POSTGRES_USER: smartlock
      POSTGRES_PASSWORD: SmartLock2026!
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - smartlock-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartlock-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass SmartLock2026!
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - smartlock-network

  # InfluxDB Time-Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: smartlock-influxdb
    restart: unless-stopped
    environment:
      INFLUXDB_DB: smartlock
      INFLUXDB_USER: admin
      INFLUXDB_PASSWORD: SmartLock2026!
      INFLUXDB_ORG: smartlock
      INFLUXDB_BUCKET: smartlock
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
    networks:
      - smartlock-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: smartlock-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - influxdb
    networks:
      - smartlock-network

  # SmartLock Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartlock-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://smartlock:SmartLock2026!@postgres:5432/smartlock
      - REDIS_URL=redis://:SmartLock2026!@redis:6379/0
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=SmartLock2026!
    ports:
      - "5000:5000"      # API
      - "5001:5001"      # WebSocket
    volumes:
      - ./data/logs:/app/logs
      - ./config/backend:/app/config
    depends_on:
      - postgres
      - redis
      - influxdb
      - mosquitto
    networks:
      - smartlock-network

  # Web Dashboard Frontend
  dashboard:
    image: nginx:alpine
    container_name: smartlock-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./static:/usr/share/nginx/html
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - smartlock-network

  # Automation Engine
  automation:
    build:
      context: .
      dockerfile: Dockerfile.automation
    container_name: smartlock-automation
    restart: unless-stopped
    environment:
      - MQTT_BROKER=mosquitto
      - DATABASE_URL=postgresql://smartlock:SmartLock2026!@postgres:5432/smartlock
    volumes:
      - ./automation:/app/automation
      - ./data/logs:/app/logs
    depends_on:
      - mosquitto
      - postgres
    networks:
      - smartlock-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartlock-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/ssl:/etc/nginx/ssl
      - ./static:/var/www/html
    depends_on:
      - backend
      - dashboard
    networks:
      - smartlock-network

networks:
  smartlock-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  mosquitto_data:
  grafana_data:
